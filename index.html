<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>机密资料库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container" id="mainPage">
        <div class="scanlines"></div>
        <div class="pixel-bar"></div>
        <div class="header">
            <div class="header-garbled-top">0xDEAD ▓▓▓▓ SYS_ERR:0x00F ▓▓▓▓ 0xBEEF ▓▓▓▓▓▓▓▓▓▓▓▓▓▓</div>
            <div class="header-title" id="headerTitle"></div>
            <div class="header-subtitle" id="headerSubtitle"></div>
        </div>
        <div class="nav-bar" id="navBar"></div>
        <div class="content-area" id="contentArea"></div>
        <div class="footer-bar">
            ▓▓▓▓▓▓▓▓▓▓▓▓ 系统时间: <span id="sysTime"></span> | 连接: <span style="animation: flicker 1.5s infinite;">■不稳定</span> | 追踪:[已加密] ▓▓▓▓▓▓▓▓▓▓▓▓
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" onclick="closePost(event)">
        <div class="modal-content" id="modalContent" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">帖子标题</div>
                <button class="modal-close" onclick="closePost()" title="关闭">✕</button>
            </div>
            <div class="modal-info">
                发帖人：<span class="poster-name" id="modalPoster">[匿名]</span> | 
                时间戳：<span id="modalTimestamp">████-██-██</span> | 
                权限：<span style="color:#c00;">RESTRICTED</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer-garbled" id="modalGarbled">
                ▓▓▓▓ 文档结束 ▓▓▓▓ 0xFF_END ▓▓▓▓
            </div>
        </div>
    </div>
    <script src="data.js"></script>
    <script>
        // ========== 初始化 ==========
        document.getElementById('headerTitle').textContent = SITE_CONFIG.title;
        document.getElementById('headerSubtitle').textContent = SITE_CONFIG.subtitle;

        // 生成导航
        const navBar = document.getElementById('navBar');
        NAV_SECTIONS.forEach((sec, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
            btn.textContent = sec.label;
            btn.onclick = () => showSection(sec.id);
            navBar.appendChild(btn);
        });

        // 生成内容
        const contentArea = document.getElementById('contentArea');
        NAV_SECTIONS.forEach(sec => {
            const div = document.createElement('div');
            div.id = 'section-' + sec.id;
            div.className = 'section-content';
            div.style.display = sec.id === 'history' ? 'block' : 'none';

            // 普通帖子
            const posts = POSTS.filter(p => p.section === sec.id);
            posts.forEach(p => {
                const card = makePostCard(p.title, p.poster, p.desc, () => openPost(p.id));
                div.appendChild(card);
            });

            // 子列表
            (sec.sublists || []).forEach(sl => {
                const card = makePostCard(sl.title, sl.poster, '点击展开 [+]', () => toggleSubList(sl.id));
                card.classList.add('has-sublist');
                div.appendChild(card);

                const subDiv = document.createElement('div');
                subDiv.id = sl.id;
                subDiv.className = 'sub-list-container';
                subDiv.innerHTML = `
                    <div class="sub-list-header">▸ ${sl.title}：</div>
                    <input class="sub-search" type="text" placeholder="搜索..." oninput="filterSubList('${sl.id}', this.value)">
                    <div class="sub-tags" id="tags-${sl.id}"></div>
                    <div class="sub-items" id="items-${sl.id}"></div>
                    <div class="sub-list-back" onclick="event.stopPropagation();toggleSubList('${sl.id}')">◄ 收起</div>
                `;
                div.appendChild(subDiv);
            });

            contentArea.appendChild(div);
        });

        // 填充子列表
        function fillSubList(listId, items, prefix) {
            const container = document.getElementById('items-' + listId);
            const tagsContainer = document.getElementById('tags-' + listId);
            const allTags = new Set();
            items.forEach(item => {
                const tag = item.tag || '未分类';
                allTags.add(tag);
                const el = document.createElement('div');
                el.className = 'sub-list-card';
                el.textContent = item.name;
                el.dataset.tag = tag;
                el.dataset.search = item.name + ' ' + tag;
                el.onclick = (e) => {
                    e.stopPropagation();
                    openPost(item.id);
                };
                container.appendChild(el);
            });

            // 生成标签筛选
            if (allTags.size > 1) {
                const allBtn = document.createElement('span');
                allBtn.className = 'sub-tag active';
                allBtn.textContent = '全部';
                allBtn.onclick = () => {
                    tagsContainer.querySelectorAll('.sub-tag').forEach(t => t.classList.remove('active'));
                    allBtn.classList.add('active');
                    filterByTag(listId, '');
                };
                tagsContainer.appendChild(allBtn);
                allTags.forEach(tag => {
                    const tagBtn = document.createElement('span');
                    tagBtn.className = 'sub-tag';
                    tagBtn.textContent = tag;
                    tagBtn.onclick = () => {
                        tagsContainer.querySelectorAll('.sub-tag').forEach(t => t.classList.remove('active'));
                        tagBtn.classList.add('active');
                        filterByTag(listId, tag);
                    };
                    tagsContainer.appendChild(tagBtn);
                });
            }
        }

        LIST_DATA.forEach(ld => fillSubList(ld.id, ld.items, ld.prefix));

        function makePostCard(title, poster, desc, onclick) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.onclick = onclick;
            card.innerHTML = `
                <div class="post-card-header">
                    <div class="post-card-title">${title}</div>
                    <div class="post-card-meta">
                        发帖人：<span class="poster">${poster}</span> | 时间：<span>████-██-██</span>
                    </div>
                </div>
                <div class="post-card-desc">${desc}</div>
            `;
            return card;
        }

        // ========== 系统时间 ==========
        function updateTime() {
            const now = new Date();
            document.getElementById('sysTime').textContent = 
                now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0') + ' ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0') + ':' +
                String(now.getSeconds()).padStart(2,'0');
        }
        updateTime(); setInterval(updateTime, 1000);

        // ========== 导航 ==========
        function showSection(name) {
            document.querySelectorAll('.section-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sub-list-container').forEach(el => el.classList.remove('show'));
            document.getElementById('section-' + name).style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.remove('active');
                if (NAV_SECTIONS[i].id === name) btn.classList.add('active');
            });
        }

        // ========== 子列表 ==========
        function toggleSubList(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.sub-list-container').forEach(s => { if (s.id !== id) s.classList.remove('show'); });
            el.classList.toggle('show');
        }

        function filterSubList(listId, query) {
            const container = document.getElementById('items-' + listId);
            const cards = container.querySelectorAll('.sub-list-card');
            const q = query.toLowerCase();
            cards.forEach(c => {
                c.style.display = c.dataset.search.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function filterByTag(listId, tag) {
            const container = document.getElementById('items-' + listId);
            const cards = container.querySelectorAll('.sub-list-card');
            cards.forEach(c => {
                c.style.display = !tag || c.dataset.tag === tag ? '' : 'none';
            });
            document.getElementById('sub-search-' + listId) && (document.getElementById('sub-search-' + listId).value = '');
        }

        // ========== 帖子弹窗 ==========
        async function openPost(postId) {
            document.querySelectorAll('.sub-list-container').forEach(el => el.classList.remove('show'));

            let post = POSTS.find(p => p.id === postId);
            if (!post) {
                for (const ld of LIST_DATA) {
                    const found = ld.items.find(i => i.id === postId);
                    if (found) { post = found; break; }
                }
            }

            document.getElementById('modalTitle').textContent = post.title || post.name;
            document.getElementById('modalPoster').textContent = post.poster || '[档案管理员]';
            const d = Math.floor(Math.random()*28)+1, m = Math.floor(Math.random()*12)+1, y = 2024 + Math.floor(Math.random()*2);
            document.getElementById('modalTimestamp').textContent = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

            // 加载 .txt 正文
            let content = '<p style="color:#999;">[加载中...]</p>';
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            document.getElementById('modalContent').scrollTop = 0;

            try {
                const res = await fetch('posts/' + postId + '.txt');
                if (res.ok) {
                    const raw = await res.text();
                    content = parseMarkdown(raw);
                } else {
                    content = post.content || '<p>■■■■■■■■■■</p>';
                }
            } catch(e) {
                content = post.content || '<p>■■■■■■■■■■</p>';
            }

            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalGarbled').innerHTML = 
                '▓▓▓▓ 文档结束 ▓▓▓▓ 0x' + Math.random().toString(16).substring(2,6).toUpperCase() + '_END ▓▓▓▓';
        }

        function parseMarkdown(raw) {
            let html = '';
            const lines = raw.split('\n');
            let inList = false;
            for (let line of lines) {
                const trimmed = line.trim();
                if (!trimmed) { if (inList) { html += '</ul>'; inList = false; } html += '<br>'; continue; }
                if (trimmed === '---') { if (inList) { html += '</ul>'; inList = false; } html += '<hr style="border:1px dashed #999;margin:16px 0;">'; continue; }
                if (trimmed.startsWith('# ')) { if (inList) { html += '</ul>'; inList = false; } html += `<h2 style="font-size:20px;font-weight:bold;color:#111;border-bottom:2px solid #111;padding-bottom:4px;margin:20px 0 10px;">${escapeHtml(trimmed.slice(2))}</h2>`; continue; }
                if (trimmed.startsWith('## ')) { if (inList) { html += '</ul>'; inList = false; } html += `<h3 style="font-size:17px;font-weight:bold;color:#1a1a3a;margin:16px 0 8px;">${escapeHtml(trimmed.slice(3))}</h3>`; continue; }
                if (trimmed.startsWith('### ')) { if (inList) { html += '</ul>'; inList = false; } html += `<h4 style="font-size:15px;font-weight:bold;color:#333;margin:12px 0 6px;">${escapeHtml(trimmed.slice(4))}</h4>`; continue; }
                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) { html += '<ul style="margin:4px 0;padding-left:20px;">'; inList = true; }
                    html += `<li style="margin-bottom:4px;">${parseInline(trimmed.slice(2))}</li>`;
                    continue;
                }
                if (inList) { html += '</ul>'; inList = false; }
                html += `<p style="margin-bottom:10px;">${parseInline(trimmed)}</p>`;
            }
            if (inList) html += '</ul>';
            return html;
        }

        function parseInline(text) {
            text = escapeHtml(text);
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/`(.+?)`/g, '<code style="background:#eee;padding:1px 4px;border:1px solid #999;">$1</code>');
            text = text.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border:3px solid #111;margin:8px 0;display:block;">');
            return text;
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function closePost(event) {
            if (event && event.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePost(); });
    </script>
</body>
</html>
